# Pinned so the repo rename (storytime-discord-bot -> STBot) keeps reusing the
# existing container and its bot_data volume.
name: storytime-discord-bot

services:
  bot:
    build: .
    container_name: storytime-discord-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Overrides whatever DATABASE_URL is in .env (that's for local dev
      # against ./dev.db) — the container's SQLite file lives in the
      # persisted volume below instead.
      DATABASE_URL: file:/app/data/prod.db
    volumes:
      - bot_data:/app/data
      # Google service-account key for frown-fill; set
      # GOOGLE_SERVICE_ACCOUNT_KEY_PATH=/app/secrets/google-sa.json in .env.
      - ${HOME}/stbot-secrets:/app/secrets:ro

volumes:
  bot_data:
