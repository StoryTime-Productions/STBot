name: deploy

# Waits for the `ci` workflow to finish on main (not a separate `needs:` in
# the same file — deploy runs on the self-hosted runner, while ci runs on
# GitHub-hosted runners, so this is two workflows linked via workflow_run
# rather than one workflow with mixed runners).
on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to self-hosted host
    runs-on: self-hosted
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # .env lives outside the git workspace (~/storytime-discord-bot.env on
      # the host) so it survives every fresh checkout — actions/checkout
      # wipes and re-clones the workspace each run, it wouldn't persist there.
      - name: Copy persistent .env into the workspace
        run: cp ~/storytime-discord-bot.env .env

      - name: Build and restart the container
        run: docker compose up -d --build
